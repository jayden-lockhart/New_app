{% extends 'accounts/base.html' %}
{% block content %}
     <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Journalists</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Browse our collection of journalists.</p>
                </div>
            </div>
        </header>
        <div class="container">
            <div class="row">
                <center>
                <div class="col-lg-8 col-md-10 mx-auto">
                
                    {% for journalist in journalists %}
                        <h2><a href="{% url 'journalist_coverage' journalist %}">{{ journalist.full_name }}</a></h2>
                    {% endfor %}
                </div>
                </center>
            </div>
        </div>

{% endblock %}
